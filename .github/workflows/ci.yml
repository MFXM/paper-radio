name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh db/init/*.sh
      - name: compose config
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/; s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=x/; s/^QDRANT_API_KEY=.*/QDRANT_API_KEY=x/; s/^MATTERMOST_CHANNEL_ID=.*/MATTERMOST_CHANNEL_ID=x/; s/^ZOTERO_LIBRARY_ID=.*/ZOTERO_LIBRARY_ID=1/; s/^ZOTERO_COLLECTION_KEY=.*/ZOTERO_COLLECTION_KEY=x/; s/^SCOUT_MODEL=.*/SCOUT_MODEL=x/; s/^LLM_MODEL_BRIEFING=.*/LLM_MODEL_BRIEFING=x/' .env
          docker compose config --quiet

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tts, pdf-converter]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: false
