version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directories: [/services/tts, /services/pdf-converter]
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: [/services/tts, /services/pdf-converter]
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
