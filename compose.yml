# paper-radio — Docker Compose stack
# Copy .env.example to .env, fill it in, then: ./scripts/init-dirs.sh && docker compose up -d
name: ${COMPOSE_PROJECT_NAME:-paper-radio}

x-restart: &restart
  restart: unless-stopped

networks:
  internal:          # no route to the internet
    internal: true
  egress:            # services that must reach the internet or be published

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      PIPELINE_DB_NAME: ${PIPELINE_DB_NAME:-pipeline}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    <<: *restart
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks: [internal]

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.30.10}
    <<: *restart
    volumes:
      - ./data/ollama:/root/.ollama
    networks: [internal, egress]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    <<: *restart
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}
    networks: [internal, egress]

  zotero-translator:
    image: zotero/translation-server:latest
    <<: *restart
    networks: [internal, egress]

  pdf-converter:
    build: ./services/pdf-converter
    image: paper-radio/pdf-converter:local
    <<: *restart
    environment:
      PDF_ALLOWED_HOSTS: ${PDF_ALLOWED_HOSTS:-arxiv.org,export.arxiv.org}
      PDF_MAX_MB: ${PDF_MAX_MB:-100}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-paper-radio/1.0}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal, egress]

  tts:
    build: ./services/tts
    image: paper-radio/tts:local
    <<: *restart
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    environment:
      PODCAST_PUBLIC_URL: ${PODCAST_PUBLIC_URL:-http://localhost:8080}
      PODCAST_TITLE: ${PODCAST_TITLE:-Research Radio}
      PODCAST_DESCRIPTION: ${PODCAST_DESCRIPTION:-Automated audio summaries of research papers}
      PODCAST_LANGUAGE: ${PODCAST_LANGUAGE:-en-gb}
      TTS_VOICE: ${TTS_VOICE:-bm_george}
      TTS_SPEED: ${TTS_SPEED:-1.0}
    volumes:
      - ./models:/models:ro
      - ./data/podcasts:/podcasts
    read_only: true
    # exec: kokoro's espeak-ng loader extracts a shared library into /tmp
    tmpfs: ["/tmp:exec,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]

  podcast-feed:
    image: nginx:stable-alpine
    <<: *restart
    volumes:
      - ./data/podcasts:/usr/share/nginx/html:ro
    ports:
      - "${FEED_BIND:-127.0.0.1}:${FEED_PORT:-8080}:80"
    networks: [internal, egress]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.27.4}
    <<: *restart
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_BIND:-127.0.0.1}:${N8N_PUBLISH_PORT:-5678}:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/state:/data
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    environment:
      # --- n8n core
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL:?set WEBHOOK_URL in .env}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      N8N_RESTRICT_FILE_ACCESS_TO: /data
      # The workflows read their settings from $env and keep state files in /data
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path,http
      # --- service endpoints (internal Docker network)
      OLLAMA_URL: http://ollama:11434
      FLARESOLVERR_URL: http://flaresolverr:8191
      ZOTERO_TRANSLATOR_URL: http://zotero-translator:1969
      PDF_CONVERTER_URL: http://pdf-converter:8002
      TTS_URL: http://tts:5000
      PODCAST_INTERNAL_URL: http://podcast-feed
      PODCAST_PUBLIC_URL: ${PODCAST_PUBLIC_URL:-http://localhost:8080}
      # --- Mattermost
      MATTERMOST_URL: ${MATTERMOST_URL:?set MATTERMOST_URL in .env}
      MATTERMOST_CHANNEL_ID: ${MATTERMOST_CHANNEL_ID:?set MATTERMOST_CHANNEL_ID in .env}
      # --- Zotero
      ZOTERO_LIBRARY_TYPE: ${ZOTERO_LIBRARY_TYPE:-users}
      ZOTERO_LIBRARY_ID: ${ZOTERO_LIBRARY_ID:?set ZOTERO_LIBRARY_ID in .env}
      ZOTERO_COLLECTION_KEY: ${ZOTERO_COLLECTION_KEY:?set ZOTERO_COLLECTION_KEY in .env}
      # --- discovery
      ARXIV_CATEGORIES: ${ARXIV_CATEGORIES:-quant-ph,cs.LG}
      SCIRATE_CATEGORY: ${SCIRATE_CATEGORY:-quant-ph}
      SCIRATE_MIN_SCITES: ${SCIRATE_MIN_SCITES:-10}
      SCOUT_MIN_SCORE: ${SCOUT_MIN_SCORE:-0.75}
      SCOUT_MAX_CANDIDATES: ${SCOUT_MAX_CANDIDATES:-100}
      OVERFLOW_ALERT_THRESHOLD: ${OVERFLOW_ALERT_THRESHOLD:-25}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-paper-radio/1.0}
      RESEARCH_EXPERTISE: ${RESEARCH_EXPERTISE:-quantum computing and machine learning}
      RESEARCH_FOCUS: ${RESEARCH_FOCUS:-quantum algorithms, quantum machine learning}
      RESEARCH_EXCLUDE: ${RESEARCH_EXCLUDE:-topics unrelated to the focus above}
      # --- models
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SCOUT_MODEL: ${SCOUT_MODEL:?set SCOUT_MODEL in .env}
      SCOUT_FALLBACK_MODEL: ${SCOUT_FALLBACK_MODEL:-${SCOUT_MODEL}}
      GEMINI_SCRIPT_MODEL: ${GEMINI_SCRIPT_MODEL:-models/gemini-flash-latest}
      GEMINI_TLDR_MODEL: ${GEMINI_TLDR_MODEL:-models/gemini-flash-lite-latest}
      LLM_MODEL_BRIEFING: ${LLM_MODEL_BRIEFING:?set LLM_MODEL_BRIEFING in .env}
      LLM_MODEL_TLDR: ${LLM_MODEL_TLDR:-${LLM_MODEL_BRIEFING}}
      LLM_MODEL_BREAKDOWN: ${LLM_MODEL_BREAKDOWN:-${LLM_MODEL_BRIEFING}}
      LLM_MODEL_OUTLINE: ${LLM_MODEL_OUTLINE:-${LLM_MODEL_BRIEFING}}
      LLM_MODEL_CHAPTER: ${LLM_MODEL_CHAPTER:-${LLM_MODEL_BRIEFING}}
      LLM_MODEL_LECTURE_PLAN: ${LLM_MODEL_LECTURE_PLAN:-${LLM_MODEL_BRIEFING}}
      LLM_MODEL_LECTURE_CHAPTER: ${LLM_MODEL_LECTURE_CHAPTER:-${LLM_MODEL_BRIEFING}}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-${LLM_MODEL_BRIEFING}}
